server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Hashed build assets (dist/assets/*) are safe to cache indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React Router: let unknown paths fall through to index.html instead of
    # a 404, so deep links and page refreshes work.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
